services:
  cloudvturb:
    build: .
    container_name: cloudvturb
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - VIDEOS_DIR=/app/videos
      - PUBLIC_DIR=/app/public
    volumes:
      - /opt/apps/cloudvturb/data:/app/data
      - /opt/apps/cloudvturb/videos:/app/videos
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 100
        reservations:
          cpus: '0.1'
          memory: 64M
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
