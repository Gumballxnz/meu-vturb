<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F8FAFC">
  <title>Aceitar Convite — CloudVTurb</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <script>
    (function() {
      try {
        var t = localStorage.getItem('cloudvturb_theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #2563EB;
      --color-primary-hover: #1D4ED8;
      --color-primary-soft: #EFF6FF;
      --color-primary-border: #BFDBFE;
      --color-page: #F8FAFC;
      --color-surface: #FFFFFF;
      --color-border: #E2E8F0;
      --color-text: #0F172A;
      --color-text-muted: #64748B;
      --color-text-dim: #94A3B8;
      --color-danger: #DC2626;
      --radius-sm: 8px;
      --radius-md: 12px;
    }

    html[data-theme="dark"] {
      --color-page: #0B0F19;
      --color-surface: #111827;
      --color-border: #1F2937;
      --color-text: #F9FAFB;
      --color-text-muted: #9CA3AF;
      --color-text-dim: #6B7280;
      --color-primary-soft: rgba(37, 99, 235, 0.15);
      --color-primary-border: rgba(37, 99, 235, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--color-page);
      color: var(--color-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .invite-container {
      width: 100%;
      max-width: 480px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      padding: 36px 32px;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand-logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
      text-decoration: none;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--color-text);
      letter-spacing: -0.5px;
    }

    .invite-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .invite-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--color-text);
      margin-bottom: 8px;
    }

    .invite-desc {
      font-size: 13.5px;
      color: var(--color-text-muted);
      line-height: 1.5;
    }

    .invite-badge {
      display: inline-block;
      padding: 4px 10px;
      background: var(--color-primary-soft);
      color: var(--color-primary);
      border: 1px solid var(--color-primary-border);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 8px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--color-text);
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      color: var(--color-text);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }

    .form-input:focus {
      border-color: var(--color-primary);
    }

    .form-input:disabled, .form-input[readonly] {
      background: rgba(148, 163, 184, 0.08);
      color: var(--color-text-muted);
      cursor: not-allowed;
    }

    .pw-wrap {
      position: relative;
    }

    .pw-toggle {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--color-text-muted);
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-submit {
      width: 100%;
      background: var(--color-primary);
      color: #ffffff;
      border: none;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s;
      margin-top: 6px;
    }

    .btn-submit:hover {
      background: var(--color-primary-hover);
    }

    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .alert-box {
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 18px;
      display: none;
    }

    .alert-error {
      background: rgba(220, 38, 38, 0.1);
      border: 1px solid rgba(220, 38, 38, 0.3);
      color: #ef4444;
    }

    .alert-success {
      background: rgba(22, 163, 74, 0.1);
      border: 1px solid rgba(22, 163, 74, 0.3);
      color: #16a34a;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .footer-link {
      text-align: center;
      margin-top: 20px;
      font-size: 12.5px;
      color: var(--color-text-dim);
    }

    .footer-link a {
      color: var(--color-primary);
      text-decoration: none;
      font-weight: 600;
    }

    .footer-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="invite-container" id="inviteCard">
    <a href="/" class="brand-logo-wrap">
      <div class="brand-icon">
        <svg width="22" height="22" viewBox="0 0 48 48" fill="none">
          <path d="M20 16.5L32 24L20 31.5V16.5Z" fill="#ffffff"/>
          <circle cx="34" cy="14" r="3" fill="#10b981"/>
        </svg>
      </div>
      <div class="brand-title">CloudVTurb</div>
    </a>

    <div id="loadingState" style="text-align: center; padding: 32px 0;">
      <div class="spinner" style="border-color: rgba(37, 99, 235, 0.2); border-top-color: var(--color-primary); width: 28px; height: 28px; margin: 0 auto 14px;"></div>
      <div style="font-size: 13.5px; color: var(--color-text-muted);">Validando convite...</div>
    </div>

    <div id="errorState" style="display: none; text-align: center; padding: 12px 0;">
      <div style="width: 44px; height: 44px; border-radius: 50%; background: rgba(220, 38, 38, 0.1); color: #ef4444; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>
      </div>
      <h3 style="font-size: 17px; font-weight: 700; color: var(--color-text); margin-bottom: 8px;" id="errorTitle">Convite Inválido</h3>
      <p style="font-size: 13.5px; color: var(--color-text-muted); line-height: 1.5; margin-bottom: 24px;" id="errorMessage">Este convite não foi encontrado ou expirou.</p>
      <a href="/login" class="btn-submit" style="text-decoration: none;">Ir para o Login</a>
    </div>

    <div id="formState" style="display: none;">
      <div class="invite-header">
        <h2 class="invite-title">Convite para a Equipe</h2>
        <p class="invite-desc">
          Você foi convidado por <strong id="inviterNameText">um administrador</strong> para fazer parte da conta no CloudVTurb.
        </p>
        <div class="invite-badge" id="roleBadge">Usuário Comum</div>
      </div>

      <div id="alertBox" class="alert-box"></div>

      <form id="acceptInviteForm" onsubmit="handleAcceptInvite(event)">
        <div class="form-group">
          <label class="form-label" for="inviteName">Seu Nome</label>
          <input type="text" id="inviteName" class="form-input" required placeholder="Digite seu nome completo">
        </div>

        <div class="form-group">
          <label class="form-label" for="inviteEmail">E-mail</label>
          <input type="email" id="inviteEmail" class="form-input" readonly>
        </div>

        <div class="form-group">
          <label class="form-label" for="invitePassword">Senha de Acesso</label>
          <div class="pw-wrap">
            <input type="password" id="invitePassword" class="form-input" required placeholder="Mínimo de 6 caracteres" style="padding-right: 40px;">
            <button type="button" class="pw-toggle" onclick="togglePasswordVisibility('invitePassword', this)" title="Visualizar senha">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="inviteConfirmPassword">Confirmar Senha</label>
          <input type="password" id="inviteConfirmPassword" class="form-input" required placeholder="Repita sua senha">
        </div>

        <button type="submit" class="btn-submit" id="btnAcceptInvite">
          <span>Aceitar Convite e Entrar</span>
        </button>
      </form>

      <div class="footer-link">
        Já possui conta? <a href="/login">Fazer login</a>
      </div>
    </div>
  </div>

  <script>
    let currentToken = '';

    function togglePasswordVisibility(id, btn) {
      const input = document.getElementById(id);
      if (!input) return;
      const isPw = input.type === 'password';
      input.type = isPw ? 'text' : 'password';
      btn.innerHTML = isPw
        ? '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>'
        : '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
    }

    function showAlert(msg, isError = true) {
      const box = document.getElementById('alertBox');
      if (!box) return;
      box.className = 'alert-box ' + (isError ? 'alert-error' : 'alert-success');
      box.textContent = msg;
      box.style.display = 'block';
    }

    async function initInvitePage() {
      const urlParams = new URLSearchParams(window.location.search);
      currentToken = urlParams.get('token') || '';

      if (!currentToken) {
        const pathParts = window.location.pathname.split('/');
        if (pathParts.length > 2 && pathParts[1] === 'convite') {
          currentToken = pathParts[2];
        }
      }

      if (!currentToken) {
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('errorState').style.display = 'block';
        document.getElementById('errorMessage').textContent = 'Nenhum token de convite fornecido no link.';
        return;
      }

      try {
        const res = await fetch(`/api/invites/verify?token=${encodeURIComponent(currentToken)}`);
        const data = await res.json();

        document.getElementById('loadingState').style.display = 'none';
        if (!res.ok || !data.valid) {
          document.getElementById('errorState').style.display = 'block';
          document.getElementById('errorMessage').textContent = data.error || 'Convite inválido ou expirado.';
          return;
        }

        const inv = data.invite;
        document.getElementById('formState').style.display = 'block';
        document.getElementById('inviterNameText').textContent = inv.inviterName || 'um administrador';
        document.getElementById('inviteName').value = inv.name || '';
        document.getElementById('inviteEmail').value = inv.email || '';
        document.getElementById('roleBadge').textContent = inv.role === 'admin' ? 'Administrador' : 'Usuário Comum';
      } catch (err) {
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('errorState').style.display = 'block';
        document.getElementById('errorMessage').textContent = 'Erro ao se comunicar com o servidor. Tente novamente.';
      }
    }

    async function handleAcceptInvite(e) {
      e.preventDefault();
      const btn = document.getElementById('btnAcceptInvite');
      const name = document.getElementById('inviteName').value.trim();
      const password = document.getElementById('invitePassword').value;
      const confirm = document.getElementById('inviteConfirmPassword').value;

      if (!name || name.length < 3) {
        return showAlert('O nome deve conter pelo menos 3 caracteres.');
      }
      if (!password || password.length < 6) {
        return showAlert('A senha deve conter pelo menos 6 caracteres.');
      }
      if (password !== confirm) {
        return showAlert('As senhas não coincidem.');
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> <span>Aceitando convite...</span>';

      try {
        const res = await fetch('/api/invites/accept', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: currentToken, name, password })
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || 'Falha ao aceitar convite.');
        }

        showAlert('Convite aceito com sucesso! Entrando na plataforma...', false);
        if (data.token) {
          try {
            localStorage.setItem('cloudvturb_token', data.token);
            if (data.user) localStorage.setItem('cloudvturb_user', JSON.stringify(data.user));
          } catch (e) {}
        }

        setTimeout(() => {
          window.location.href = '/';
        }, 1000);
      } catch (err) {
        showAlert(err.message);
        btn.disabled = false;
        btn.innerHTML = '<span>Aceitar Convite e Entrar</span>';
      }
    }

    initInvitePage();
  </script>
</body>
</html>
