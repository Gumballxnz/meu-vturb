<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Player de vídeo otimizado para alta retenção e conversão.">
  <title>CloudVTurb Player</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .player-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }
    .playback-shield {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      cursor: pointer;
      background: transparent;
    }
    .smart-autoplay-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.35s ease, visibility 0.35s ease;
      padding: 16px;
    }
    .smart-autoplay-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .smart-autoplay-overlay.pos-center {
      align-items: center;
      justify-content: center;
    }
    .smart-autoplay-overlay.pos-top {
      align-items: flex-start;
      justify-content: center;
      padding-top: clamp(20px, 6vh, 48px);
    }
    .smart-autoplay-overlay.pos-bottom {
      align-items: flex-end;
      justify-content: center;
      padding-bottom: clamp(24px, 8vh, 56px);
    }
    .pulse-badge-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s ease;
      max-width: 90%;
    }
    .pulse-badge-wrapper:hover {
      transform: scale(1.03);
    }
    .pulse-badge-wrapper:active {
      transform: scale(0.98);
    }
    .pulse-badge-halo {
      position: absolute;
      inset: -8px;
      border-radius: inherit;
      pointer-events: none;
      transition: all 0.3s ease;
    }
    .pulse-badge {
      position: relative;
      display: flex;
      align-items: center;
      transition: all 0.3s ease;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 2;
    }
    .pulse-icon-box {
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }
    .pulse-icon-box svg {
      transition: all 0.2s ease;
    }
    .pulse-text-block {
      display: flex;
      flex-direction: column;
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: -0.01em;
      white-space: pre-line;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      transition: color 0.3s ease;
    }
    .pulse-badge-wrapper.style-capsule .pulse-badge {
      flex-direction: row;
    }
    .pulse-badge-wrapper.style-card .pulse-badge {
      flex-direction: column;
      text-align: center;
    }
    .pulse-badge-wrapper.style-card .pulse-text-block {
      text-align: center;
    }
    .pulse-badge-wrapper.style-square .pulse-badge {
      flex-direction: row;
    }
    .pulse-badge-wrapper.style-circle .pulse-badge {
      flex-direction: column;
      text-align: center;
    }
    .pulse-badge-wrapper.style-circle .pulse-text-block {
      text-align: center;
      font-size: 11px;
    }
    .pulse-badge-wrapper.size-compact .pulse-badge {
      padding: 7px 14px 7px 8px;
      gap: 10px;
    }
    .pulse-badge-wrapper.size-compact.style-card .pulse-badge {
      padding: 12px 16px;
      gap: 8px;
    }
    .pulse-badge-wrapper.size-compact .pulse-icon-box {
      width: 34px;
      height: 34px;
      min-width: 34px;
    }
    .pulse-badge-wrapper.size-compact .pulse-icon-box svg {
      width: 17px;
      height: 17px;
    }
    .pulse-badge-wrapper.size-compact .pulse-text-block {
      font-size: 12px;
    }
    .pulse-badge-wrapper.size-medium .pulse-badge {
      padding: 10px 22px 10px 12px;
      gap: 14px;
    }
    .pulse-badge-wrapper.size-medium.style-card .pulse-badge {
      padding: 18px 24px;
      gap: 12px;
    }
    .pulse-badge-wrapper.size-medium .pulse-icon-box {
      width: 44px;
      height: 44px;
      min-width: 44px;
    }
    .pulse-badge-wrapper.size-medium .pulse-icon-box svg {
      width: 22px;
      height: 22px;
    }
    .pulse-badge-wrapper.size-medium .pulse-text-block {
      font-size: 13.5px;
    }
    .pulse-badge-wrapper.size-large .pulse-badge {
      padding: 14px 28px 14px 16px;
      gap: 16px;
    }
    .pulse-badge-wrapper.size-large.style-card .pulse-badge {
      padding: 24px 32px;
      gap: 14px;
    }
    .pulse-badge-wrapper.size-large .pulse-icon-box {
      width: 54px;
      height: 54px;
      min-width: 54px;
    }
    .pulse-badge-wrapper.size-large .pulse-icon-box svg {
      width: 28px;
      height: 28px;
    }
    .pulse-badge-wrapper.size-large .pulse-text-block {
      font-size: 16px;
    }
    .pulse-badge-wrapper.anim-pulse .pulse-badge-halo {
      animation: vturb-halo-pulse 2.2s infinite ease-in-out;
    }
    .pulse-badge-wrapper.anim-pulse .pulse-icon-box {
      animation: vturb-icon-pulse 2s infinite ease-in-out;
    }
    .pulse-badge-wrapper.anim-glow .pulse-badge-halo {
      display: none;
    }
    .pulse-badge-wrapper.anim-glow .pulse-badge {
      animation: vturb-glow-pulse 2.4s infinite ease-in-out;
    }
    .pulse-badge-wrapper.anim-none .pulse-badge-halo {
      display: none;
    }
    .pulse-badge-wrapper.anim-none .pulse-badge {
      animation: none;
    }
    .pulse-badge-wrapper.anim-none .pulse-icon-box {
      animation: none;
    }
    @keyframes vturb-halo-pulse {
      0%, 100% {
        transform: scale(0.96);
        opacity: 0.85;
      }
      50% {
        transform: scale(1.08);
        opacity: 0.35;
      }
    }
    @keyframes vturb-icon-pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.07);
      }
    }
    @keyframes vturb-glow-pulse {
      0%, 100% {
        filter: drop-shadow(0 0 8px var(--an-glow-color, rgba(37, 99, 235, 0.4)));
      }
      50% {
        filter: drop-shadow(0 0 22px var(--an-glow-color, rgba(37, 99, 235, 0.85)));
      }
    }
    .progress-bar-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.18);
      z-index: 25;
      overflow: hidden;
      cursor: default;
    }
    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background-color: #2563EB;
      transition: width 0.1s linear;
      position: relative;
    }
    .progress-bar-fill::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 8px;
      box-shadow: 0 0 10px 2px rgba(255, 255, 255, 0.8);
      background: rgba(255, 255, 255, 0.4);
    }
    .resume-modal {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18, 18, 21, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(8px);
      padding: 12px 20px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 14px;
      color: #fff;
      font-size: 13px;
      z-index: 40;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      white-space: nowrap;
    }
    .resume-modal.active {
      opacity: 1;
      visibility: visible;
    }
    .resume-btn-confirm {
      background: #2563EB;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .resume-btn-confirm:hover {
      background: #1D4ED8;
    }
    .resume-btn-dismiss {
      background: transparent;
      color: #a1a1aa;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .resume-btn-dismiss:hover {
      color: #ffffff;
    }
    .cta-container {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translate(-50%, 20px);
      width: calc(100% - 32px);
      max-width: 480px;
      z-index: 35;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.5s ease, transform 0.5s ease, visibility 0.5s ease;
      pointer-events: none;
    }
    .cta-container.visible {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0);
      pointer-events: auto;
    }
    .cta-button {
      width: 100%;
      background: #10b981;
      color: #ffffff;
      text-decoration: none;
      text-align: center;
      padding: 16px 24px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.5), 0 0 20px rgba(16, 185, 129, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      animation: cta-pulse 1.8s infinite ease-in-out;
      border: none;
      transition: transform 0.15s ease, filter 0.2s ease;
    }
    .cta-button:hover {
      transform: scale(1.02);
      filter: brightness(1.08);
    }
    .cta-button:active {
      transform: scale(0.98);
    }
    .cta-subtext {
      margin-top: 8px;
      font-size: 11px;
      color: #e4e4e7;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    @keyframes cta-pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.04);
      }
    }
    .play-pause-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      opacity: 0;
      visibility: hidden;
      z-index: 20;
      transition: all 0.25s ease;
      pointer-events: none;
    }
    .play-pause-indicator.show {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1);
    }
  </style>
</head>
<body>
  <div class="player-wrapper" id="playerWrapper">
    <video id="videoElement" playsinline webkit-playsinline preload="auto" disablepictureinpicture controlslist="nodownload nofullscreen noremoteplayback"></video>
    <div class="playback-shield" id="playbackShield"></div>

    <div class="play-pause-indicator" id="playPauseIndicator">
      <svg id="playPauseIcon" width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
        <polygon points="5 3 19 12 5 21 5 3"></polygon>
      </svg>
    </div>

    <div class="smart-autoplay-overlay pos-center" id="smartOverlay">
      <div class="pulse-badge-wrapper style-square size-medium anim-none" id="pulseBadgeWrapper">
        <div class="pulse-badge-halo" id="pulseHalo" style="display: none;"></div>
        <div class="pulse-badge" id="pulseBadge">
          <div class="pulse-icon-box" id="pulseIcon">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <line x1="23" y1="9" x2="17" y2="15" stroke-width="2.2" stroke-linecap="round"></line>
              <line x1="17" y1="9" x2="23" y2="15" stroke-width="2.2" stroke-linecap="round"></line>
            </svg>
          </div>
          <div class="pulse-text-block" id="overlayText">Seu vídeo ja iniciou&#10;Clique para escutar</div>
        </div>
      </div>
    </div>

    <div class="resume-modal" id="resumeModal">
      <span>Continuar de onde você parou? (<span id="resumeTimeLabel">00:00</span>)</span>
      <button class="resume-btn-confirm" id="btnResumeYes">Sim, continuar</button>
      <button class="resume-btn-dismiss" id="btnResumeNo">Recomeçar</button>
    </div>

    <div class="progress-bar-container" id="progressBarContainer">
      <div class="progress-bar-fill" id="progressBarFill"></div>
    </div>

    <div class="cta-container" id="ctaContainer">
      <a href="#" target="_blank" rel="noopener noreferrer" class="cta-button" id="ctaBtn">
        <span id="ctaBtnText">QUERO GARANTIR MINHA VAGA</span>
      </a>
      <div class="cta-subtext" id="ctaSubtextContainer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
        </svg>
        <span id="ctaSubtext">Compra 100% Segura • Acesso Imediato</span>
      </div>
    </div>
  </div>

  <script>
    (async function () {
      'use strict';

      function getOrCreateVisitorId() {
        let vid = null;
        try { vid = localStorage.getItem('cloudvturb_vid'); } catch (e) {}
        if (!vid) {
          vid = 'v_' + Math.random().toString(36).substring(2, 10) + '_' + Date.now().toString(36);
          try { localStorage.setItem('cloudvturb_vid', vid); } catch (e) {}
        }
        return vid;
      }

      const visitorId = getOrCreateVisitorId();
      const sessionId = 's_' + Math.random().toString(36).substring(2, 10) + '_' + Date.now().toString(36);

      const params = new URLSearchParams(window.location.search);
      let pathnameId = '';
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      if (pathParts.length > 0) {
        const lastPart = pathParts[pathParts.length - 1];
        if (lastPart !== 'player' && lastPart !== 'player.html') {
          pathnameId = lastPart;
        }
      }

      const vidId = params.get('id') || pathnameId || '';
      let videoSrc = params.get('v') || '';
      let dbSettings = {};

      if (vidId && !videoSrc) {
        try {
          const res = await fetch(`/api/videos/${encodeURIComponent(vidId)}/public`);
          if (res.ok) {
            const data = await res.json();
            videoSrc = data.video_url || '';
            dbSettings = data.settings || {};
            if (data.title) {
              document.title = data.title;
            }
          }
        } catch (e) {}
      }

      if (videoSrc && videoSrc.startsWith('/videos/')) {
        videoSrc = `${window.location.origin}${videoSrc}`;
      }

      const barColor = params.get('bar_color') || dbSettings.barColor || '#2563EB';
      const borderRadius = params.get('border_radius') || dbSettings.borderRadius || '0px';
      const smartAutoplay = params.has('smart_autoplay') ? params.get('smart_autoplay') !== '0' : (dbSettings.smartAutoplay !== false);
      const fakeProgress = params.has('fake_progress') ? params.get('fake_progress') === '1' : (dbSettings.fakeProgress === true);
      const blockSeek = params.has('block_seek') ? params.get('block_seek') !== '0' : (dbSettings.blockSeek !== false);
      const resumeEnabled = params.has('resume') ? params.get('resume') === '1' : (dbSettings.resume === true);
      const ctaTime = params.has('cta_time') ? parseFloat(params.get('cta_time')) : (dbSettings.ctaTime || 0);
      const ctaUrl = params.get('cta_url') || dbSettings.ctaUrl || '';
      const ctaText = params.get('cta_text') || dbSettings.ctaText || 'QUERO GARANTIR MINHA VAGA';
      const ctaColor = params.get('cta_color') || dbSettings.ctaColor || '#2563EB';
      const ctaSub = params.get('cta_subtext') || dbSettings.ctaSubtext || 'Compra 100% Segura • Acesso Imediato';
      const pixelsEnabled = params.has('pixels') ? params.get('pixels') === '1' : (dbSettings.pixels === true);

      const AUDIO_ICONS = {
        'volume-muted': '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15" stroke-width="2.2" stroke-linecap="round"></line><line x1="17" y1="9" x2="23" y2="15" stroke-width="2.2" stroke-linecap="round"></line></svg>',
        'speaker-high': '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07" fill="none" stroke-width="2.2"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14" fill="none" stroke-width="2.2"></path></svg>',
        'volume-2': '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07" fill="none" stroke-width="2.2"></path></svg>',
        'sound-wave': '<svg viewBox="0 0 24 24" stroke="currentColor" fill="none"><line x1="12" y1="3" x2="12" y2="21" stroke-width="2.4" stroke-linecap="round"></line><line x1="7" y1="7" x2="7" y2="17" stroke-width="2.4" stroke-linecap="round"></line><line x1="2" y1="11" x2="2" y2="13" stroke-width="2.4" stroke-linecap="round"></line><line x1="17" y1="7" x2="17" y2="17" stroke-width="2.4" stroke-linecap="round"></line><line x1="22" y1="11" x2="22" y2="13" stroke-width="2.4" stroke-linecap="round"></line></svg>',
        'bell': '<svg viewBox="0 0 24 24" stroke="currentColor" fill="none"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" stroke-width="2"></path><path d="M13.73 21a2 2 0 0 1-3.46 0" stroke-width="2"></path></svg>'
      };

      const audioNoticeConfig = {
        enabled: params.has('an_enabled') ? params.get('an_enabled') === '1' : (dbSettings.audioNoticeEnabled !== undefined ? dbSettings.audioNoticeEnabled !== false : smartAutoplay),
        text: params.get('an_text') || dbSettings.audioNoticeText || dbSettings.autoplayText || 'Seu vídeo ja iniciou\nClique para escutar',
        style: params.get('an_style') || dbSettings.audioNoticeStyle || 'square',
        size: params.get('an_size') || dbSettings.audioNoticeSize || 'medium',
        position: params.get('an_pos') || dbSettings.audioNoticePosition || 'center',
        animation: params.get('an_anim') || dbSettings.audioNoticeAnimation || 'none',
        icon: params.get('an_icon') || dbSettings.audioNoticeIcon || 'volume-muted',
        bgColor: params.get('an_bg') || dbSettings.audioNoticeBgColor || '#2563EB',
        textColor: params.get('an_text_color') || dbSettings.audioNoticeTextColor || '#FFFFFF',
        iconBgColor: params.get('an_icon_bg') || dbSettings.audioNoticeIconBgColor || '#2563EB',
        iconColor: params.get('an_icon_color') || dbSettings.audioNoticeIconColor || '#FFFFFF',
        borderColor: params.get('an_border_color') || dbSettings.audioNoticeBorderColor || '#1D4ED8',
        borderWidth: params.get('an_border_width') || dbSettings.audioNoticeBorderWidth || '0px',
        borderRadius: params.get('an_border_radius') || dbSettings.audioNoticeBorderRadius || '8px',
        glow: params.get('an_glow') || dbSettings.audioNoticeGlow || 'subtle'
      };

      const playerWrapper = document.getElementById('playerWrapper');
      const video = document.getElementById('videoElement');
      const playbackShield = document.getElementById('playbackShield');
      const smartOverlay = document.getElementById('smartOverlay');
      const pulseBadgeWrapper = document.getElementById('pulseBadgeWrapper');
      const pulseBadge = document.getElementById('pulseBadge');
      const overlayText = document.getElementById('overlayText');
      const pulseIcon = document.getElementById('pulseIcon');
      const progressBarFill = document.getElementById('progressBarFill');
      const resumeModal = document.getElementById('resumeModal');
      const resumeTimeLabel = document.getElementById('resumeTimeLabel');
      const btnResumeYes = document.getElementById('btnResumeYes');
      const btnResumeNo = document.getElementById('btnResumeNo');
      const ctaContainer = document.getElementById('ctaContainer');
      const ctaBtn = document.getElementById('ctaBtn');
      const ctaBtnText = document.getElementById('ctaBtnText');
      const ctaSubtext = document.getElementById('ctaSubtext');
      const playPauseIndicator = document.getElementById('playPauseIndicator');
      const playPauseIcon = document.getElementById('playPauseIcon');

      function applyAudioNoticeSettings(cfg) {
        if (!smartOverlay || !pulseBadge || !pulseIcon || !overlayText) return;

        if (cfg.enabled === false) {
          smartOverlay.classList.add('hidden');
          return;
        } else if (!hasUserUnmuted) {
          smartOverlay.classList.remove('hidden');
        }

        smartOverlay.classList.remove('pos-center', 'pos-top', 'pos-bottom');
        smartOverlay.classList.add(`pos-${cfg.position || 'center'}`);

        pulseBadgeWrapper.classList.remove('style-capsule', 'style-card', 'style-square', 'style-circle');
        pulseBadgeWrapper.classList.add(`style-${cfg.style || 'square'}`);

        pulseBadgeWrapper.classList.remove('size-compact', 'size-medium', 'size-large');
        pulseBadgeWrapper.classList.add(`size-${cfg.size || 'medium'}`);

        pulseBadgeWrapper.classList.remove('anim-pulse', 'anim-glow', 'anim-none');
        pulseBadgeWrapper.classList.add(`anim-${cfg.animation || 'none'}`);

        const bg = cfg.bgColor || '#2563EB';
        pulseBadge.style.backgroundColor = bg;

        const textColor = cfg.textColor || '#FFFFFF';
        overlayText.style.color = textColor;

        const iconBg = cfg.iconBgColor || '#2563EB';
        pulseIcon.style.backgroundColor = iconBg;

        const iconColor = cfg.iconColor || '#FFFFFF';
        pulseIcon.style.color = iconColor;

        const iconKey = cfg.icon || 'volume-muted';
        if (AUDIO_ICONS[iconKey]) {
          pulseIcon.innerHTML = AUDIO_ICONS[iconKey];
          const svgEl = pulseIcon.querySelector('svg');
          if (svgEl) svgEl.style.color = iconColor;
        }

        const bWidth = cfg.borderWidth !== undefined ? cfg.borderWidth : '0px';
        const bColor = cfg.borderColor || '#1D4ED8';
        pulseBadge.style.border = `${bWidth} solid ${bColor}`;

        let bRadius = cfg.borderRadius;
        if (!bRadius) {
          if (cfg.style === 'capsule') bRadius = '9999px';
          else if (cfg.style === 'circle') bRadius = '50%';
          else if (cfg.style === 'card') bRadius = '12px';
          else bRadius = '8px';
        }
        pulseBadge.style.borderRadius = bRadius;
        const pulseHalo = document.getElementById('pulseHalo');
        if (pulseHalo) pulseHalo.style.borderRadius = bRadius;

        const glow = cfg.glow || 'subtle';
        pulseBadgeWrapper.style.setProperty('--an-glow-color', iconBg);

        if (glow === 'none') {
          pulseBadge.style.boxShadow = '0 4px 14px rgba(0, 0, 0, 0.45)';
          if (pulseHalo) pulseHalo.style.display = 'none';
        } else if (glow === 'intense') {
          pulseBadge.style.boxShadow = `0 12px 32px -4px rgba(0, 0, 0, 0.6), 0 0 24px ${iconBg}88`;
          if (pulseHalo) {
            pulseHalo.style.display = cfg.animation === 'pulse' ? 'block' : 'none';
            pulseHalo.style.opacity = '1';
            pulseHalo.style.background = `${iconBg}26`;
            pulseHalo.style.borderColor = `${iconBg}66`;
            pulseHalo.style.boxShadow = `0 0 24px ${iconBg}50`;
          }
        } else {
          pulseBadge.style.boxShadow = `0 8px 24px -4px rgba(0, 0, 0, 0.5), 0 0 14px ${iconBg}35`;
          if (pulseHalo) {
            pulseHalo.style.display = cfg.animation === 'pulse' ? 'block' : 'none';
            pulseHalo.style.opacity = '0.6';
            pulseHalo.style.background = `${iconBg}18`;
            pulseHalo.style.borderColor = `${iconBg}44`;
            pulseHalo.style.boxShadow = `0 0 16px ${iconBg}30`;
          }
        }

        if (cfg.text) {
          overlayText.innerHTML = '';
          const lines = cfg.text.split('\n');
          if (lines.length > 1) {
            const l1 = document.createElement('span');
            l1.style.fontWeight = '700';
            l1.textContent = lines[0];
            const l2 = document.createElement('span');
            l2.style.fontSize = '0.9em';
            l2.style.fontWeight = '600';
            l2.style.opacity = '0.95';
            l2.textContent = lines.slice(1).join(' ');
            overlayText.appendChild(l1);
            overlayText.appendChild(l2);
          } else {
            overlayText.textContent = cfg.text;
          }
        }
      }

      if (borderRadius) {
        playerWrapper.style.borderRadius = borderRadius.includes('px') ? borderRadius : borderRadius + 'px';
      }
      if (barColor) {
        progressBarFill.style.backgroundColor = barColor;
      }

      applyAudioNoticeSettings(audioNoticeConfig);

      window.addEventListener('message', function (e) {
        if (!e.data) return;
        if (e.data.type === 'UPDATE_AUDIO_NOTICE') {
          applyAudioNoticeSettings(e.data.payload);
        } else if (e.data.type === 'SHOW_AUDIO_OVERLAY') {
          hasUserUnmuted = false;
          smartOverlay.classList.remove('hidden');
        }
      });

      if (ctaColor) {
        ctaBtn.style.background = ctaColor;
        ctaBtn.style.boxShadow = `0 10px 25px -5px ${ctaColor}80, 0 0 20px ${ctaColor}66`;
      }
      if (ctaText) ctaBtnText.textContent = ctaText;
      if (ctaSub) ctaSubtext.textContent = ctaSub;
      if (ctaUrl) ctaBtn.href = ctaUrl;

      document.addEventListener('contextmenu', function (e) {
        e.preventDefault();
        return false;
      });

      document.addEventListener('keydown', function (e) {
        if ((e.ctrlKey && (e.key === 's' || e.key === 'u')) || e.key === 'F12') {
          e.preventDefault();
          return false;
        }
      });

      function emitAnalyticsEvent(eventType, milestone, watchTime) {
        if (!vidId) return;
        const payload = {
          videoId: vidId,
          visitorId: visitorId,
          sessionId: sessionId,
          eventType: eventType,
          milestone: milestone !== undefined ? milestone : null,
          watchTime: watchTime || 0
        };

        const json = JSON.stringify(payload);
        if (navigator.sendBeacon) {
          try {
            navigator.sendBeacon('/api/analytics/event', new Blob([json], { type: 'application/json' }));
            return;
          } catch (e) {}
        }

        fetch('/api/analytics/event', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: json,
          keepalive: true
        }).catch(function () {});
      }

      emitAnalyticsEvent('page_view', null, 0);

      if (videoSrc) {
        const isHls = videoSrc.includes('.m3u8');
        if (isHls) {
          const script = document.createElement('script');
          script.src = 'https://cdn.jsdelivr.net/npm/hls.js@latest';
          script.onload = function () {
            if (window.Hls && window.Hls.isSupported()) {
              const hls = new window.Hls();
              hls.loadSource(videoSrc);
              hls.attachMedia(video);
              hls.on(window.Hls.Events.MANIFEST_PARSED, function () {
                startPlayback();
              });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
              video.src = videoSrc;
              startPlayback();
            }
          };
          document.head.appendChild(script);
        } else {
          video.src = videoSrc;
          startPlayback();
        }
      }

      let hasUserUnmuted = false;
      let playRegistered = false;

      function registerPlay() {
        if (playRegistered) return;
        playRegistered = true;
        emitAnalyticsEvent('play', null, video.currentTime || 0);
      }

      video.addEventListener('play', registerPlay);

      video.addEventListener('pause', function () {
        if (!video.ended && video.currentTime > 0.5) {
          emitAnalyticsEvent('pause', null, video.currentTime);
        }
      });

      function startPlayback() {
        if (smartAutoplay) {
          video.muted = true;
          const playPromise = video.play();
          if (playPromise !== undefined) {
            playPromise.then(function () {
              registerPlay();
            }).catch(function () {});
          }
        } else {
          smartOverlay.classList.add('hidden');
          video.play().catch(function () {});
          registerPlay();
        }
      }

      smartOverlay.addEventListener('click', unmuteAndRestart);

      function unmuteAndRestart() {
        hasUserUnmuted = true;
        smartOverlay.classList.add('hidden');
        video.muted = false;
        if (video.currentTime > 2) {
          video.currentTime = 0;
        }
        video.play().catch(function () {});
      }

      let indicatorTimeout;
      playbackShield.addEventListener('click', function () {
        if (!hasUserUnmuted && smartAutoplay && !smartOverlay.classList.contains('hidden')) {
          unmuteAndRestart();
          return;
        }
        if (video.paused) {
          video.play();
          showPlayPause(true);
        } else {
          video.pause();
          showPlayPause(false);
        }
      });

      function showPlayPause(isPlaying) {
        clearTimeout(indicatorTimeout);
        if (isPlaying) {
          playPauseIcon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"></polygon>';
        } else {
          playPauseIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';
        }
        playPauseIndicator.classList.add('show');
        indicatorTimeout = setTimeout(function () {
          playPauseIndicator.classList.remove('show');
        }, 500);
      }

      const storageKey = 'cloudvturb_pos_' + vidId;
      const pixelFired = { p25: false, p50: false, p75: false, p90: false, pitch: false };
      const milestonesFired = new Set();

      video.addEventListener('timeupdate', function () {
        const cur = video.currentTime;
        const dur = video.duration || 1;
        let percentage = (cur / dur) * 100;

        if (fakeProgress && percentage > 0 && percentage < 95) {
          const factor = Math.min(1.35, 1 + (1 - percentage / 100) * 0.35);
          percentage = Math.min(percentage * factor, 98);
        }

        progressBarFill.style.width = Math.min(100, Math.max(0, percentage)) + '%';

        const rawPct = (cur / dur) * 100;
        const targets = [10, 25, 50, 75, 90];
        for (const t of targets) {
          if (rawPct >= t && !milestonesFired.has(t)) {
            milestonesFired.add(t);
            emitAnalyticsEvent('progress', t, cur);
          }
        }

        if (resumeEnabled && cur > 5 && cur < dur - 5) {
          try {
            localStorage.setItem(storageKey, Math.floor(cur));
          } catch (e) {}
        }

        if (ctaTime > 0 && cur >= ctaTime) {
          if (!ctaContainer.classList.contains('visible')) {
            ctaContainer.classList.add('visible');
            emitAnalyticsEvent('pitch_viewed', null, cur);
            emitAnalyticsEvent('cta_shown', null, cur);
            if (pixelsEnabled && !pixelFired.pitch) {
              pixelFired.pitch = true;
              sendTrackingEvent('PitchViewed', { time: cur });
            }
          }
        }

        if (pixelsEnabled && dur > 1) {
          if (rawPct >= 25 && !pixelFired.p25) {
            pixelFired.p25 = true;
            sendTrackingEvent('VideoPercent25', { percent: 25 });
          }
          if (rawPct >= 50 && !pixelFired.p50) {
            pixelFired.p50 = true;
            sendTrackingEvent('VideoPercent50', { percent: 50 });
          }
          if (rawPct >= 75 && !pixelFired.p75) {
            pixelFired.p75 = true;
            sendTrackingEvent('VideoPercent75', { percent: 75 });
          }
          if (rawPct >= 90 && !pixelFired.p90) {
            pixelFired.p90 = true;
            sendTrackingEvent('VideoPercent90', { percent: 90 });
          }
        }
      });

      ctaBtn.addEventListener('click', function () {
        emitAnalyticsEvent('cta_clicked', null, video.currentTime || 0);
        sendTrackingEvent('CtaClicked', { time: video.currentTime || 0, url: ctaBtn.href });
      });

      function sendTrackingEvent(eventName, payload) {
        if (window.parent) {
          window.parent.postMessage({
            source: 'cloudvturb_player',
            event: eventName,
            data: payload
          }, '*');
        }

        try {
          if (typeof window.fbq === 'function') {
            window.fbq('trackCustom', eventName, payload);
          }
        } catch (e) {}
      }

      if (resumeEnabled) {
        video.addEventListener('loadedmetadata', function () {
          try {
            const savedTime = parseFloat(localStorage.getItem(storageKey));
            if (savedTime && savedTime > 5 && savedTime < (video.duration - 10)) {
              const minutes = Math.floor(savedTime / 60).toString().padStart(2, '0');
              const seconds = Math.floor(savedTime % 60).toString().padStart(2, '0');
              resumeTimeLabel.textContent = `${minutes}:${seconds}`;
              resumeModal.classList.add('active');

              btnResumeYes.onclick = function () {
                video.currentTime = savedTime;
                resumeModal.classList.remove('active');
                if (!hasUserUnmuted && smartAutoplay) {
                  unmuteAndRestart();
                }
              };

              btnResumeNo.onclick = function () {
                localStorage.removeItem(storageKey);
                resumeModal.classList.remove('active');
              };

              setTimeout(function () {
                resumeModal.classList.remove('active');
              }, 10000);
            }
          } catch (e) {}
        });
      }

      video.addEventListener('ended', function () {
        if (!milestonesFired.has(100)) {
          milestonesFired.add(100);
          emitAnalyticsEvent('progress', 100, video.duration || 0);
        }
        emitAnalyticsEvent('complete', 100, video.duration || 0);
        try {
          localStorage.removeItem(storageKey);
        } catch (e) {}
      });
    })();
  </script>
</body>
</html>
