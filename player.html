<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CloudVTurb High-Conversion Player</title>
  <style>
* {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .player-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .anti-copy-shield {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      cursor: pointer;
      background: transparent;
    }

    .smart-autoplay-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(2px);
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.35s ease, visibility 0.35s ease;
      padding: 20px;
      text-align: center;
    }
    .smart-autoplay-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .pulse-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(15, 23, 42, 0.85);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      padding: 16px 28px;
      border-radius: 9999px;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6), 0 0 0 0 rgba(37, 99, 235, 0.6);
      animation: pulse-border 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
      max-width: 90%;
    }
    .pulse-icon-box {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #2563eb;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      flex-shrink: 0;
      animation: pulse-scale 1.8s infinite ease-in-out;
    }
    .pulse-icon-box svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }
    @keyframes pulse-border {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.65), 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      }
      50% {
        box-shadow: 0 0 0 16px rgba(37, 99, 235, 0), 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      }
    }
    @keyframes pulse-scale {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.1);
      }
    }

    .progress-bar-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.18);
      z-index: 25;
      overflow: hidden;
      cursor: default;
    }
    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background-color: #2563eb;
      transition: width 0.1s linear;
      position: relative;
    }
    .progress-bar-fill::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 8px;
      box-shadow: 0 0 10px 2px rgba(255, 255, 255, 0.8);
      background: rgba(255, 255, 255, 0.4);
    }

    .resume-modal {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      padding: 12px 20px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 14px;
      color: #fff;
      font-size: 13px;
      z-index: 40;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      white-space: nowrap;
    }
    .resume-modal.active {
      opacity: 1;
      visibility: visible;
    }
    .resume-btn-confirm {
      background: #2563eb;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .resume-btn-confirm:hover {
      background: #1d4ed8;
    }
    .resume-btn-dismiss {
      background: transparent;
      color: #94a3b8;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .resume-btn-dismiss:hover {
      color: #ffffff;
    }

    .cta-container {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 480px;
      z-index: 35;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, 20px);
      transition: opacity 0.5s ease, transform 0.5s ease, visibility 0.5s ease;
      pointer-events: none;
    }
    .cta-container.visible {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0);
      pointer-events: auto;
    }
    .cta-button {
      width: 100%;
      background: #10b981;
      color: #ffffff;
      text-decoration: none;
      text-align: center;
      padding: 16px 24px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.5), 0 0 20px rgba(16, 185, 129, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      animation: cta-pulse 1.8s infinite ease-in-out;
      border: none;
      transition: transform 0.15s ease, filter 0.2s ease;
    }
    .cta-button:hover {
      transform: scale(1.02);
      filter: brightness(1.08);
    }
    .cta-button:active {
      transform: scale(0.98);
    }
    .cta-subtext {
      margin-top: 8px;
      font-size: 11px;
      color: #e2e8f0;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    @keyframes cta-pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.04);
      }
    }

    .play-pause-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      opacity: 0;
      visibility: hidden;
      z-index: 20;
      transition: all 0.25s ease;
      pointer-events: none;
    }
    .play-pause-indicator.show {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1);
    }
</style>
</head>
<body>
  <div class="player-wrapper" id="playerWrapper">

    <video id="videoElement" playsinline webkit-playsinline preload="auto" disablepictureinpicture controlslist="nodownload nofullscreen noremoteplayback"></video>

    <div class="anti-copy-shield" id="antiCopyShield"></div>

    <div class="play-pause-indicator" id="playPauseIndicator">
      <svg id="playPauseIcon" width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
        <polygon points="5 3 19 12 5 21 5 3"></polygon>
      </svg>
    </div>

    <div class="smart-autoplay-overlay" id="smartOverlay">
      <div class="pulse-badge" id="pulseBadge">
        <div class="pulse-icon-box" id="pulseIcon">
          <svg viewBox="0 0 24 24">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
        </div>
        <span id="overlayText">Seu vídeo já começou. Toque para ativar o som</span>
      </div>
    </div>

    <div class="resume-modal" id="resumeModal">
      <span>Continuar de onde você parou? (<span id="resumeTimeLabel">00:00</span>)</span>
      <button class="resume-btn-confirm" id="btnResumeYes">Sim, continuar</button>
      <button class="resume-btn-dismiss" id="btnResumeNo">Recomeçar</button>
    </div>

    <div class="progress-bar-container" id="progressBarContainer">
      <div class="progress-bar-fill" id="progressBarFill"></div>
    </div>

    <div class="cta-container" id="ctaContainer">
      <a href="#" target="_blank" rel="noopener noreferrer" class="cta-button" id="ctaBtn">
        <span id="ctaBtnText">QUERO GARANTIR MINHA VAGA</span>
      </a>
      <div class="cta-subtext" id="ctaSubtextContainer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
        </svg>
        <span id="ctaSubtext">Compra 100% Segura • Acesso Imediato</span>
      </div>
    </div>
  </div>

  <script>
(function () {
      'use strict';

      const params = new URLSearchParams(window.location.search);
      const videoSrc = params.get('v') || '';
      const barColor = params.get('bar_color') || '#2563eb';
      const borderRadius = params.get('border_radius') || '0px';
      const smartAutoplay = params.get('smart_autoplay') !== '0';
      const overlayCustomText = params.get('autoplay_text');
      const fakeProgress = params.get('fake_progress') === '1';
      const blockSeek = params.get('block_seek') !== '0';
      const resumeEnabled = params.get('resume') === '1';
      const ctaTime = parseFloat(params.get('cta_time')) || 0;
      const ctaUrl = params.get('cta_url') || '';
      const ctaText = params.get('cta_text') || 'QUERO GARANTIR MINHA VAGA AGORA';
      const ctaColor = params.get('cta_color') || '#10b981';
      const ctaSub = params.get('cta_subtext') || 'Compra 100% Segura • Acesso Imediato';
      const pixelsEnabled = params.get('pixels') === '1';
      const vidId = params.get('id') || btoa(videoSrc).substring(0, 16);

      const playerWrapper = document.getElementById('playerWrapper');
      const video = document.getElementById('videoElement');
      const antiCopyShield = document.getElementById('antiCopyShield');
      const smartOverlay = document.getElementById('smartOverlay');
      const overlayText = document.getElementById('overlayText');
      const pulseIcon = document.getElementById('pulseIcon');
      const progressBarFill = document.getElementById('progressBarFill');
      const resumeModal = document.getElementById('resumeModal');
      const resumeTimeLabel = document.getElementById('resumeTimeLabel');
      const btnResumeYes = document.getElementById('btnResumeYes');
      const btnResumeNo = document.getElementById('btnResumeNo');
      const ctaContainer = document.getElementById('ctaContainer');
      const ctaBtn = document.getElementById('ctaBtn');
      const ctaBtnText = document.getElementById('ctaBtnText');
      const ctaSubtext = document.getElementById('ctaSubtext');
      const playPauseIndicator = document.getElementById('playPauseIndicator');
      const playPauseIcon = document.getElementById('playPauseIcon');

      if (borderRadius) {
        playerWrapper.style.borderRadius = borderRadius.includes('px') ? borderRadius : borderRadius + 'px';
      }
      if (barColor) {
        progressBarFill.style.backgroundColor = barColor;
        pulseIcon.style.backgroundColor = barColor;
      }
      if (overlayCustomText) {
        overlayText.textContent = overlayCustomText;
      }
      if (ctaColor) {
        ctaBtn.style.background = ctaColor;
        ctaBtn.style.boxShadow = `0 10px 25px -5px ${ctaColor}80, 0 0 20px ${ctaColor}66`;
      }
      if (ctaText) {
        ctaBtnText.textContent = ctaText;
      }
      if (ctaSub) {
        ctaSubtext.textContent = ctaSub;
      }
      if (ctaUrl) {
        ctaBtn.href = ctaUrl;
      }

      document.addEventListener('contextmenu', function (e) {
        e.preventDefault();
        return false;
      });
      document.addEventListener('keydown', function (e) {

        if ((e.ctrlKey && (e.key === 's' || e.key === 'u')) || e.key === 'F12') {
          e.preventDefault();
          return false;
        }
      });

      if (videoSrc) {
        const isHls = videoSrc.includes('.m3u8');
        if (isHls) {

          const script = document.createElement('script');
          script.src = 'https://cdn.jsdelivr.net/npm/hls.js@latest';
          script.onload = function () {
            if (window.Hls && window.Hls.isSupported()) {
              const hls = new window.Hls();
              hls.loadSource(videoSrc);
              hls.attachMedia(video);
              hls.on(window.Hls.Events.MANIFEST_PARSED, function () {
                startPlayback();
              });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {

              video.src = videoSrc;
              startPlayback();
            }
          };
          document.head.appendChild(script);
        } else {
          video.src = videoSrc;
          startPlayback();
        }
      }

      let hasUserUnmuted = false;

      let playRegistered = false;
      function registerPlay() {
        if (playRegistered) return;
        playRegistered = true;
        if (vidId) {
          const apiOrigin = window.location.origin;
          fetch(apiOrigin + '/api/videos/' + vidId + '/play', { method: 'POST' }).catch(function () {});
        }
      }

      video.addEventListener('play', registerPlay);

      function startPlayback() {
        if (smartAutoplay) {
          video.muted = true;
          const playPromise = video.play();
          if (playPromise !== undefined) {
            playPromise.then(function () {
              // Iniciou mudo com sucesso
              registerPlay();
            }).catch(function (err) {
              console.log('Autoplay bloqueado pelo navegador, aguardando clique:', err);
            });
          }
        } else {
          smartOverlay.classList.add('hidden');
          video.play().catch(function () {});
          registerPlay();
        }
      }

      smartOverlay.addEventListener('click', function () {
        unmuteAndRestart();
      });

      function unmuteAndRestart() {
        hasUserUnmuted = true;
        smartOverlay.classList.add('hidden');
        video.muted = false;

        if (video.currentTime > 2) {
          video.currentTime = 0;
        }
        video.play().catch(function () {});
      }

      let indicatorTimeout;
      antiCopyShield.addEventListener('click', function () {
        if (!hasUserUnmuted && smartAutoplay && !smartOverlay.classList.contains('hidden')) {
          unmuteAndRestart();
          return;
        }
        if (video.paused) {
          video.play();
          showPlayPause(true);
        } else {
          video.pause();
          showPlayPause(false);
        }
      });

      function showPlayPause(isPlaying) {
        clearTimeout(indicatorTimeout);
        if (isPlaying) {
          playPauseIcon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"></polygon>';
        } else {
          playPauseIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';
        }
        playPauseIndicator.classList.add('show');
        indicatorTimeout = setTimeout(function () {
          playPauseIndicator.classList.remove('show');
        }, 500);
      }

      const storageKey = 'cloudvturb_pos_' + vidId;
      const pixelFired = { p25: false, p50: false, p75: false, p90: false, pitch: false };

      video.addEventListener('timeupdate', function () {
        const cur = video.currentTime;
        const dur = video.duration || 1;
        let percentage = (cur / dur) * 100;

        if (fakeProgress && percentage > 0 && percentage < 95) {

          const factor = Math.min(1.35, 1 + (1 - percentage / 100) * 0.35);
          percentage = Math.min(percentage * factor, 98);
        }

        progressBarFill.style.width = Math.min(100, Math.max(0, percentage)) + '%';

        if (resumeEnabled && cur > 5 && cur < dur - 5) {
          try {
            localStorage.setItem(storageKey, Math.floor(cur));
          } catch (e) {}
        }

        if (ctaTime > 0 && cur >= ctaTime) {
          if (!ctaContainer.classList.contains('visible')) {
            ctaContainer.classList.add('visible');
            if (pixelsEnabled && !pixelFired.pitch) {
              pixelFired.pitch = true;
              sendTrackingEvent('PitchViewed', { time: cur });
            }
          }
        }

        if (pixelsEnabled && dur > 1) {
          const rawPercent = (cur / dur) * 100;
          if (rawPercent >= 25 && !pixelFired.p25) {
            pixelFired.p25 = true;
            sendTrackingEvent('VideoPercent25', { percent: 25 });
          }
          if (rawPercent >= 50 && !pixelFired.p50) {
            pixelFired.p50 = true;
            sendTrackingEvent('VideoPercent50', { percent: 50 });
          }
          if (rawPercent >= 75 && !pixelFired.p75) {
            pixelFired.p75 = true;
            sendTrackingEvent('VideoPercent75', { percent: 75 });
          }
          if (rawPercent >= 90 && !pixelFired.p90) {
            pixelFired.p90 = true;
            sendTrackingEvent('VideoPercent90', { percent: 90 });
          }
        }
      });

      function sendTrackingEvent(eventName, payload) {

        if (window.parent) {
          window.parent.postMessage({
            source: 'cloudvturb_player',
            event: eventName,
            data: payload
          }, '*');
        }

        try {
          if (typeof window.fbq === 'function') {
            window.fbq('trackCustom', eventName, payload);
          }
        } catch (e) {}
      }

      if (resumeEnabled) {
        video.addEventListener('loadedmetadata', function () {
          try {
            const savedTime = parseFloat(localStorage.getItem(storageKey));
            if (savedTime && savedTime > 5 && savedTime < (video.duration - 10)) {
              const minutes = Math.floor(savedTime / 60).toString().padStart(2, '0');
              const seconds = Math.floor(savedTime % 60).toString().padStart(2, '0');
              resumeTimeLabel.textContent = `${minutes}:${seconds}`;
              resumeModal.classList.add('active');

              btnResumeYes.onclick = function () {
                video.currentTime = savedTime;
                resumeModal.classList.remove('active');
                if (!hasUserUnmuted && smartAutoplay) {
                  unmuteAndRestart();
                }
              };

              btnResumeNo.onclick = function () {
                localStorage.removeItem(storageKey);
                resumeModal.classList.remove('active');
              };

              setTimeout(function () {
                resumeModal.classList.remove('active');
              }, 10000);
            }
          } catch (e) {}
        });
      }

      video.addEventListener('ended', function () {
        try {
          localStorage.removeItem(storageKey);
        } catch (e) {}
      });

    })();
</script>
</body>
</html>
