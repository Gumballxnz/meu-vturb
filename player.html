<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Player de vídeo otimizado para alta retenção e conversão.">
  <title>CloudVTurb Player</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
* {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    html.is-preview, html.is-preview body, html.is-preview .player-wrapper {
      background-color: transparent !important;
    }
    html.theme-light, html.theme-light body {
      background-color: #000 !important;
      color: #fff;
    }
    .player-wrapper {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }
    html.theme-light .player-wrapper {
      background: #000;
    }
    .player-skeleton {
      position: absolute;
      inset: 0;
      z-index: 6;
      background: #090d16;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: opacity 0.35s ease, visibility 0.35s ease;
      pointer-events: none;
    }
    html.theme-light .player-skeleton {
      background: #090d16;
    }
    .player-skeleton.hidden {
      opacity: 0;
      visibility: hidden;
    }
    .player-skeleton-shimmer {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.07) 50%, transparent 100%);
      background-size: 200% 100%;
      animation: playerShimmerAnim 1.8s infinite ease-in-out;
    }
    html.theme-light .player-skeleton-shimmer {
      background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.07) 50%, transparent 100%);
      background-size: 200% 100%;
    }
    @keyframes playerShimmerAnim {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .player-skeleton-pulse {
      position: relative;
      z-index: 2;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.5);
    }
    html.theme-light .player-skeleton-pulse {
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.5);
    }
    .player-poster {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 5;
      transition: opacity 0.35s ease, visibility 0.35s ease;
      pointer-events: none;
    }
    .player-poster.hidden {
      opacity: 0;
      visibility: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }
    .playback-shield {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      cursor: pointer;
      background: transparent;
    }
    .smart-autoplay-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.35s ease, visibility 0.35s ease;
      padding: 16px;
    }
    .smart-autoplay-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .smart-autoplay-overlay.pos-center {
      align-items: center;
      justify-content: center;
    }
    .smart-autoplay-overlay.pos-top {
      align-items: flex-start;
      justify-content: center;
      padding-top: clamp(20px, 6vh, 48px);
    }
    .smart-autoplay-overlay.pos-bottom {
      align-items: flex-end;
      justify-content: center;
      padding-bottom: clamp(24px, 8vh, 56px);
    }
    .pulse-badge-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s ease;
      max-width: 90%;
    }
    .pulse-badge-wrapper:hover {
      transform: scale(1.03);
    }
    .pulse-badge-wrapper:active {
      transform: scale(0.98);
    }
    .pulse-badge-halo {
      position: absolute;
      inset: -8px;
      border-radius: inherit;
      pointer-events: none;
      transition: all 0.3s ease;
    }
    .pulse-badge {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 2;
      box-sizing: border-box;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }
    .pulse-text-top, .pulse-text-bottom {
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.01em;
      text-align: center;
      white-space: normal;
      transition: color 0.3s ease;
      user-select: none;
    }
    .pulse-icon-box {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }
    .pulse-icon-box svg {
      display: block;
      transition: all 0.2s ease;
    }
    .pulse-badge-wrapper.style-square .pulse-badge {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: min(240px, 85vw);
      padding: 20px 16px;
      gap: 12px;
      border-radius: 9px;
      border: 2.25px solid rgb(255, 255, 255);
      background: var(--an-bg, #2563EB);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
    }
    .pulse-badge-wrapper.style-square .pulse-text-top {
      order: 1;
      font-size: 16px;
    }
    .pulse-badge-wrapper.style-square .pulse-icon-box {
      order: 2;
      background: transparent !important;
      box-shadow: none !important;
      width: auto;
      height: auto;
      min-width: unset;
      margin: auto 0;
    }
    .pulse-badge-wrapper.style-square .pulse-icon-box svg {
      width: 62px;
      height: 62px;
    }
    .pulse-badge-wrapper.style-square .pulse-text-bottom {
      order: 3;
      font-size: 15.5px;
    }
    .pulse-badge-wrapper.style-card .pulse-badge {
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      border-radius: 12px;
      padding: 22px 20px;
      gap: 12px;
      width: min(250px, 85vw);
      min-height: 190px;
    }
    .pulse-badge-wrapper.style-card .pulse-text-top { order: 1; font-size: 16px; }
    .pulse-badge-wrapper.style-card .pulse-icon-box {
      order: 2;
      background: transparent !important;
      box-shadow: none !important;
      width: auto;
      height: auto;
      min-width: unset;
      margin: auto 0;
    }
    .pulse-badge-wrapper.style-card .pulse-icon-box svg { width: 56px; height: 56px; }
    .pulse-badge-wrapper.style-card .pulse-text-bottom { order: 3; font-size: 15px; }
    .pulse-badge-wrapper.style-capsule .pulse-badge {
      flex-direction: row;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      padding: 10px 22px 10px 14px;
      gap: 14px;
      width: auto;
      height: auto;
      aspect-ratio: auto;
    }
    .pulse-badge-wrapper.style-capsule .pulse-icon-box {
      order: 1;
      width: 44px;
      height: 44px;
      min-width: 44px;
      border-radius: 50%;
    }
    .pulse-badge-wrapper.style-capsule .pulse-icon-box svg {
      width: 22px;
      height: 22px;
    }
    .pulse-badge-wrapper.style-capsule .pulse-text-top {
      order: 2;
      font-size: 13.5px;
      text-align: left;
    }
    .pulse-badge-wrapper.style-capsule .pulse-text-bottom {
      order: 3;
      font-size: 12px;
      text-align: left;
      opacity: 0.95;
    }
    .pulse-badge-wrapper.style-circle .pulse-badge {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      aspect-ratio: 1 / 1;
      width: min(200px, 78vw);
      height: min(200px, 78vw);
      padding: 18px;
      gap: 8px;
    }
    .pulse-badge-wrapper.style-circle .pulse-text-top { order: 1; font-size: 13px; }
    .pulse-badge-wrapper.style-circle .pulse-icon-box { order: 2; }
    .pulse-badge-wrapper.style-circle .pulse-icon-box svg { width: 48px; height: 48px; }
    .pulse-badge-wrapper.style-circle .pulse-text-bottom { order: 3; font-size: 12px; }
    .pulse-badge-wrapper.size-compact.style-square .pulse-badge {
      width: min(175px, 72vw);
      height: min(175px, 72vw);
      padding: 16px 12px;
      gap: 8px;
    }
    .pulse-badge-wrapper.size-compact.style-square .pulse-text-top { font-size: 13px; }
    .pulse-badge-wrapper.size-compact.style-square .pulse-icon-box svg { width: 46px; height: 46px; }
    .pulse-badge-wrapper.size-compact.style-square .pulse-text-bottom { font-size: 12.5px; }
    .pulse-badge-wrapper.size-medium.style-square .pulse-badge {
      width: min(220px, 80vw);
      height: min(220px, 80vw);
      padding: 24px 16px;
      gap: 12px;
    }
    .pulse-badge-wrapper.size-medium.style-square .pulse-text-top { font-size: 16px; }
    .pulse-badge-wrapper.size-medium.style-square .pulse-icon-box svg { width: 62px; height: 62px; }
    .pulse-badge-wrapper.size-medium.style-square .pulse-text-bottom { font-size: 15.5px; }
    .pulse-badge-wrapper.size-large.style-square .pulse-badge {
      width: min(265px, 88vw);
      height: min(265px, 88vw);
      padding: 28px 18px;
      gap: 16px;
    }
    .pulse-badge-wrapper.size-large.style-square .pulse-text-top { font-size: 18px; }
    .pulse-badge-wrapper.size-large.style-square .pulse-icon-box svg { width: 78px; height: 78px; }
    .pulse-badge-wrapper.size-large.style-square .pulse-text-bottom { font-size: 17.5px; }
    .pulse-badge-wrapper.anim-pulse .pulse-badge-halo {
      animation: vturb-halo-pulse 2.2s infinite ease-in-out;
    }
    .pulse-badge-wrapper.anim-pulse .pulse-icon-box {
      animation: vturb-icon-pulse 2s infinite ease-in-out;
    }
    .pulse-badge-wrapper.anim-glow .pulse-badge-halo {
      display: none;
    }
    .pulse-badge-wrapper.anim-glow .pulse-badge {
      animation: vturb-glow-pulse 2.4s infinite ease-in-out;
    }
    .pulse-badge-wrapper.anim-none .pulse-badge-halo {
      display: none;
    }
    .pulse-badge-wrapper.anim-none .pulse-badge {
      animation: none;
    }
    .pulse-badge-wrapper.anim-none .pulse-icon-box {
      animation: none;
    }
    @keyframes vturb-halo-pulse {
      0%, 100% {
        transform: scale(0.96);
        opacity: 0.85;
      }
      50% {
        transform: scale(1.08);
        opacity: 0.35;
      }
    }
    @keyframes vturb-icon-pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.07);
      }
    }
    @keyframes vturb-glow-pulse {
      0%, 100% {
        filter: drop-shadow(0 0 8px var(--an-glow-color, rgba(37, 99, 235, 0.4)));
      }
      50% {
        filter: drop-shadow(0 0 22px var(--an-glow-color, rgba(37, 99, 235, 0.85)));
      }
    }
    .progress-bar-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.18);
      z-index: 25;
      overflow: hidden;
      cursor: default;
    }
    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background-color: #2563EB;
      transition: width 0.1s linear;
      position: relative;
    }
    .progress-bar-fill::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 8px;
      box-shadow: 0 0 10px 2px rgba(255, 255, 255, 0.8);
      background: rgba(255, 255, 255, 0.4);
    }
    .resume-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      background-color: var(--resume-bg, rgba(0, 0, 0, 0.7));
      color: var(--resume-color, #ffffff);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      padding: 16px;
      box-sizing: border-box;
    }
    .resume-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .resume__content {
      text-align: center;
      width: 100%;
      max-width: 360px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .resume__title {
      color: var(--resume-color, #ffffff);
      font-size: clamp(16px, 4.5vw, 22px);
      font-weight: 700;
      line-height: 1.3;
      margin: 0 0 6px 0;
      text-align: center;
      max-width: 100%;
      word-break: break-word;
    }
    .resume__actions {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 14px;
      margin: 0 auto;
    }
    .resume__action-btn {
      background: transparent;
      border: none;
      color: var(--resume-color, #ffffff);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 8px;
      user-select: none;
      text-decoration: none;
      transition: transform 0.15s ease, opacity 0.2s ease;
    }
    .resume__action-btn:hover {
      transform: scale(1.04);
      opacity: 0.9;
    }
    .resume__action-btn:active {
      transform: scale(0.98);
    }
    .resume__icon {
      border: 2px solid var(--resume-color, #ffffff);
      border-radius: 50%;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      margin-right: 12px;
      flex-shrink: 0;
      fill: var(--resume-color, #ffffff);
    }
    .resume__icon svg {
      width: 18px;
      height: 18px;
      display: block;
      fill: currentColor;
    }
    .resume__play .resume__icon svg {
      margin-left: 2px;
    }
    .resume__text {
      font-size: clamp(14px, 3.8vw, 17px);
      font-weight: 700;
      line-height: 1.2;
      text-align: left;
      color: var(--resume-color, #ffffff);
    }
    .cta-container {
      width: 100%;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 16px;
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.5s ease, opacity 0.5s ease, padding 0.5s ease;
      pointer-events: none;
      flex-shrink: 0;
    }
    .cta-container.visible {
      max-height: 160px;
      opacity: 1;
      padding: 12px 16px 14px;
      pointer-events: auto;
    }
    .cta-container.position-inside {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      z-index: 35;
      background: transparent;
      padding: 0 16px;
    }
    .cta-container.position-inside.visible {
      padding: 0 16px;
    }
    .cta-button {
      width: 100%;
      max-width: 400px;
      background: #00cd3c;
      color: #ffffff;
      text-decoration: none;
      text-align: center;
      padding: 15px 24px;
      border-radius: 12px;
      font-family: 'Inter', -apple-system, sans-serif;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      box-shadow: 0 10px 25px -5px rgba(0, 205, 60, 0.5), 0 0 20px rgba(0, 205, 60, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      animation: cta-pulse 1.8s infinite ease-in-out;
      border: none;
      transition: transform 0.15s ease, filter 0.2s ease;
    }
    .cta-button:hover {
      transform: scale(1.02);
      filter: brightness(1.08);
    }
    .cta-button:active {
      transform: scale(0.98);
    }
    .cta-subtext {
      margin-top: 8px;
      font-size: 11px;
      color: #e4e4e7;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    @keyframes cta-pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.04);
      }
    }
    .play-pause-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      opacity: 0;
      visibility: hidden;
      z-index: 20;
      transition: all 0.25s ease;
      pointer-events: none;
    }
    .play-pause-indicator.show {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1);
    }
</style>
  <script src="/js/hls.min.js">

</script>
</head>
<body>
  <div class="player-wrapper" id="playerWrapper">
    <div class="player-poster" id="playerPoster"></div>
    <div class="player-skeleton" id="playerSkeleton">
      <div class="player-skeleton-shimmer"></div>
      <div class="player-skeleton-pulse">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
      </div>
    </div>
    <video id="videoElement" playsinline webkit-playsinline preload="auto" disablepictureinpicture controlslist="nodownload nofullscreen noremoteplayback"></video>
    <div class="playback-shield" id="playbackShield"></div>

    <div class="play-pause-indicator" id="playPauseIndicator">
      <svg id="playPauseIcon" width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
        <polygon points="5 3 19 12 5 21 5 3"></polygon>
      </svg>
    </div>

    <div class="smart-autoplay-overlay pos-center hidden" id="smartOverlay">
      <div class="pulse-badge-wrapper style-square size-medium anim-none" id="pulseBadgeWrapper">
        <div class="pulse-badge-halo" id="pulseHalo" style="display: none;"></div>
        <div class="pulse-badge" id="pulseBadge">
          <div class="pulse-text-top" id="overlayTextTop">Seu video ja iniciou</div>
          <div class="pulse-icon-box" id="pulseIcon">
            <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 6L6 10H2V18H6L11 22V6Z" fill="currentColor" stroke="currentColor" stroke-width="1.5"/>
              <path d="M15.5 10.5C16.8 11.6 17.5 12.8 17.5 14C17.5 15.2 16.8 16.4 15.5 17.5" stroke="currentColor" stroke-width="2.2"/>
              <path d="M19 7.5C21 9.5 22 11.7 22 14C22 16.3 21 18.5 19 20.5" stroke="currentColor" stroke-width="2.2"/>
              <path d="M22.5 4.5C25.2 7.2 26.5 10.5 26.5 14C26.5 17.5 25.2 20.8 22.5 23.5" stroke="currentColor" stroke-width="2.2"/>
              <line x1="2" y1="2" x2="26" y2="26" stroke="currentColor" stroke-width="2.8"/>
            </svg>
          </div>
          <div class="pulse-text-bottom" id="overlayTextBottom">Clique para escutar</div>
        </div>
      </div>
    </div>

    <div class="resume-overlay pointer" id="resumeModal">
      <div class="resume__content">
        <div class="resume__title" id="resumeTitle">Já começou a ver este vídeo</div>
        <div class="resume__actions">
          <div class="resume__play resume__action-btn" id="btnResumeYes">
            <span class="resume__icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><g><path fill-rule="evenodd" clip-rule="evenodd" d="M5 21.7232L22.0156 12L5 2.27685L5 21.7232Z"></path></g></svg>
            </span>
            <span class="resume__text" id="resumePlayText">Continuar Assistindo</span>
          </div>
          <div class="resume__rewind resume__action-btn" id="btnResumeNo">
            <span class="resume__icon">
              <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24">
                <path fill="currentColor" d="M12.567 1.258A10.822 10.822 0 0 0 2.818 8.4a.25.25 0 0 1-.271.163L.858 8.309a.514.514 0 0 0-.485.213.5.5 0 0 0-.021.53l2.679 4.7a.5.5 0 0 0 .786.107l3.77-3.746a.5.5 0 0 0-.279-.85l-1.715-.256a.25.25 0 0 1-.192-.35 8.26 8.26 0 1 1 7.866 11.59 1.25 1.25 0 0 0 .045 2.5h.047a10.752 10.752 0 1 0-.792-21.487v-.002Z"/>
              </svg>
            </span>
            <span class="resume__text" id="resumeReplayText">Reiniciar o vídeo</span>
          </div>
        </div>
      </div>
    </div>

    <div class="progress-bar-container" id="progressBarContainer">
      <div class="progress-bar-fill" id="progressBarFill"></div>
    </div>
  </div>

  <div class="cta-container" id="ctaContainer">
    <a href="#" target="_blank" rel="noopener noreferrer" class="cta-button" id="ctaBtn">
      <span id="ctaBtnText"></span>
    </a>

        pulseBadgeWrapper.style.setProperty('--an-glow-color', iconBg);

        if (glow === 'none') {
          pulseBadge.style.boxShadow = '0 4px 14px rgba(0, 0, 0, 0.45)';
          if (pulseHalo) pulseHalo.style.display = 'none';
        } else if (glow === 'intense') {
          pulseBadge.style.boxShadow = `0 12px 32px -4px rgba(0, 0, 0, 0.6), 0 0 24px ${iconBg}88`;
          if (pulseHalo) {
            pulseHalo.style.display = cfg.animation === 'pulse' ? 'block' : 'none';
            pulseHalo.style.opacity = '1';
            pulseHalo.style.background = `${iconBg}26`;
            pulseHalo.style.borderColor = `${iconBg}66`;
            pulseHalo.style.boxShadow = `0 0 24px ${iconBg}50`;
          }
        } else {
          pulseBadge.style.boxShadow = `0 8px 24px -4px rgba(0, 0, 0, 0.5), 0 0 14px ${iconBg}35`;
          if (pulseHalo) {
            pulseHalo.style.display = cfg.animation === 'pulse' ? 'block' : 'none';
            pulseHalo.style.opacity = '0.6';
            pulseHalo.style.background = `${iconBg}18`;
            pulseHalo.style.borderColor = `${iconBg}44`;
            pulseHalo.style.boxShadow = `0 0 16px ${iconBg}30`;
          }
        }

        if (cfg.text) {
          const lines = cfg.text.split(/\\n|\n/);
          if (lines.length > 1) {
            if (overlayTextTop) overlayTextTop.textContent = lines[0];
            if (overlayTextBottom) {
              overlayTextBottom.textContent = lines.slice(1).join(' ');
              overlayTextBottom.style.display = 'block';
            }
          } else {
            if (overlayTextTop) overlayTextTop.textContent = cfg.text;
            if (overlayTextBottom) {
              overlayTextBottom.textContent = '';
              overlayTextBottom.style.display = 'none';
            }
          }
        }
      }

      if (borderRadius) {
        playerWrapper.style.borderRadius = borderRadius.includes('px') ? borderRadius : borderRadius + 'px';
      }
      if (barColor) {
        progressBarFill.style.backgroundColor = barColor;
      }

      applyAudioNoticeSettings(audioNoticeConfig);

      function resumeAndPlay(targetTime) {
        if (resumeModal) resumeModal.classList.remove('active');
        hasUserUnmuted = true;
        if (smartOverlay) smartOverlay.classList.add('hidden');
        video.muted = false;
        video.volume = 1;
        video.currentTime = targetTime;
        const playPromise = video.play();
        if (playPromise !== undefined) {
          playPromise.then(function () {
            registerPlay();
          }).catch(function () {
            video.muted = true;
            video.play().then(function () {
              registerPlay();
            }).catch(function () {});
          });
        }
      }

      if (resumeModal) {
        if (isPreview) {
          resumeModal.style.display = 'none';
        }
        resumeModal.style.setProperty('--resume-bg', resumeBgColor);
        resumeModal.style.setProperty('--resume-color', resumeTextColor);
        const titleEl = document.getElementById('resumeTitle');
        if (titleEl) titleEl.textContent = resumeTitle;
        const playEl = document.getElementById('resumePlayText');
        if (playEl) playEl.textContent = resumePlayText;
        const replayEl = document.getElementById('resumeReplayText');
        if (replayEl) replayEl.textContent = resumeReplayText;

        if (hasSavedResume) {
          resumeModal.classList.add('active');
          if (smartOverlay) smartOverlay.classList.add('hidden');

          if (btnResumeYes) {
            btnResumeYes.onclick = function (e) {
              if (e) e.stopPropagation();
              resumeAndPlay(savedResumeTime);
            };
          }

          if (btnResumeNo) {
            btnResumeNo.onclick = function (e) {
              if (e) e.stopPropagation();
              try { localStorage.removeItem(storageKey); } catch (err) {}
              resumeAndPlay(0);
            };
          }
        }
      }

      window.addEventListener('message', function (e) {
        if (!e.data) return;
        if (e.data.type === 'UPDATE_AUDIO_NOTICE') {
          applyAudioNoticeSettings(e.data.payload);
        } else if (e.data.type === 'SHOW_AUDIO_OVERLAY') {
          if (!hasSavedResume) {
            hasUserUnmuted = false;
            smartOverlay.classList.remove('hidden');
          }
        }
      });

      if (ctaColor) {
        ctaBtn.style.background = ctaColor;
        ctaBtn.style.boxShadow = `0 10px 25px -5px ${ctaColor}80, 0 0 20px ${ctaColor}66`;
      }
      if (ctaText) ctaBtnText.textContent = ctaText;
      if (ctaSub) {
        ctaSubtext.textContent = ctaSub;
        const subWrap = document.getElementById('ctaSubtextContainer');
        if (subWrap) subWrap.style.display = 'flex';
      } else {
        const subWrap = document.getElementById('ctaSubtextContainer');
        if (subWrap) subWrap.style.display = 'none';
      }
      if (ctaUrl) ctaBtn.href = ctaUrl;
      if (ctaPosition === 'inside') {
        ctaContainer.classList.add('position-inside');
        playerWrapper.appendChild(ctaContainer);
      }
      if (ctaAnimation === 'none') {
        ctaBtn.style.animation = 'none';
      }
      if (!ctaNewTab) {
        ctaBtn.removeAttribute('target');
      }

      document.addEventListener('contextmenu', function (e) {
        e.preventDefault();
        return false;
      });

      document.addEventListener('keydown', function (e) {
        if ((e.ctrlKey && (e.key === 's' || e.key === 'u')) || e.key === 'F12') {
          e.preventDefault();
          return false;
        }
      });

      function emitAnalyticsEvent(eventType, milestone, watchTime) {
        if (!vidId || isPreview) return;
        const payload = {
          videoId: vidId,
          visitorId: visitorId,
          sessionId: sessionId,
          eventType: eventType,
          milestone: milestone !== undefined ? milestone : null,
          watchTime: watchTime || 0,
          ...trackingCtx
        };

        const json = JSON.stringify(payload);
        const endpoint = `${window.location.origin}/api/analytics/event`;

        if (navigator.sendBeacon && (eventType === 'pause' || eventType === 'complete')) {
          try {
            navigator.sendBeacon(endpoint, new Blob([json], { type: 'application/json' }));
            return;
          } catch (e) {}
        }

        fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: json,
          keepalive: true
        }).catch(function () {});
      }

      setInterval(function () {
        if (video && !video.paused && !video.ended) {
          emitAnalyticsEvent('heartbeat', null, video.currentTime || 0);
        }
      }, 20000);

      emitAnalyticsEvent('page_view', null, 0);

      let hlsInstance = null;

      function loadHlsStream(streamUrl, startTime, autoplayAudio, startPaused) {
        if (hlsInstance) {
          try { hlsInstance.destroy(); } catch (e) {}
          hlsInstance = null;
        }

        if (window.Hls && window.Hls.isSupported()) {
          hlsInstance = new window.Hls({
            enableWorker: true,
            lowLatencyMode: true,
            startLevel: 0,
            startFragPrefetch: true,
            maxBufferLength: 8,
            maxMaxBufferLength: 15,
            backBufferLength: 10
          });
          hlsInstance.loadSource(streamUrl);
          hlsInstance.attachMedia(video);
          hlsInstance.on(window.Hls.Events.MANIFEST_PARSED, function () {
            if (startTime > 0) video.currentTime = startTime;
            if (startPaused) {
              video.pause();
              return;
            }
            if (autoplayAudio) {
              video.muted = false;
              video.volume = 1;
            } else {
              video.muted = true;
            }
            const playPromise = video.play();
            if (playPromise !== undefined) {
              playPromise.then(function () {
                registerPlay();
              }).catch(function () {
                video.muted = true;
                video.play().catch(function () {});
                if (smartOverlay && !hasUserUnmuted && !hasSavedResume) {
                  smartOverlay.classList.remove('hidden');
                }
              });
            }
          });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = streamUrl;
          video.addEventListener('loadedmetadata', function onMeta() {
            video.removeEventListener('loadedmetadata', onMeta);
            if (startTime > 0) video.currentTime = startTime;
            if (startPaused) {
              video.pause();
              return;
            }
            if (autoplayAudio) {
              video.muted = false;
              video.volume = 1;
            } else {
              video.muted = true;
            }
            const playPromise = video.play();
            if (playPromise !== undefined) {
              playPromise.then(function () {
                registerPlay();
              }).catch(function () {
                video.muted = true;
                video.play().catch(function () {});
                if (smartOverlay && !hasUserUnmuted && !hasSavedResume) {
                  smartOverlay.classList.remove('hidden');
                }
              });
            }
          });
        } else if (videoSrc) {
          video.src = videoSrc;
          if (startTime > 0) video.currentTime = startTime;
          if (startPaused) {
            video.pause();
            return;
          }
          if (autoplayAudio) {
            video.muted = false;
            video.volume = 1;
          } else {
            video.muted = true;
          }
          const playPromise = video.play();
          if (playPromise !== undefined) {
            playPromise.then(function () {
              registerPlay();
            }).catch(function () {
              video.muted = true;
              video.play().catch(function () {});
              if (smartOverlay && !hasUserUnmuted && !hasSavedResume) {
                smartOverlay.classList.remove('hidden');
              }
            });
          }
        }
      }

      function registerPlay() {
        if (playRegistered) return;
        playRegistered = true;
        emitAnalyticsEvent('play', null, video.currentTime || 0);
        emitAnalyticsEvent('heartbeat', null, video.currentTime || 0);
      }

      video.addEventListener('play', registerPlay);

      video.addEventListener('pause', function () {
        if (!video.ended && video.currentTime > 0.5) {
          emitAnalyticsEvent('pause', null, video.currentTime);
        }
      });

      function startPlayback() {
        if (smartAutoplay) {
          video.muted = true;
          const playPromise = video.play();
          if (playPromise !== undefined) {
            playPromise.then(function () {
              registerPlay();
            }).catch(function () {
              video.muted = true;
              video.play().catch(function () {});
            });
          }
        } else {
          smartOverlay.classList.add('hidden');
          const playPromise = video.play();
          if (playPromise !== undefined) {
            playPromise.then(function () {
              registerPlay();
            }).catch(function () {
              video.muted = true;
              video.play().catch(function () {});
              if (!hasUserUnmuted && !hasSavedResume) {
                smartOverlay.classList.remove('hidden');
              }
            });
          }
        }
      }

      const primaryStream = hlsSrc || videoSrc;
      const shouldUseTeaser = !isPreview && !hasSavedResume && smartAutoplay && smartAutoplaySrc && !hasUserUnmuted;

      if (hasSavedResume && !isPreview) {
        if (primaryStream) {
          if (primaryStream.includes('.m3u8')) {
            loadHlsStream(primaryStream, savedResumeTime, false, true);
          } else {
            video.src = primaryStream;
            video.currentTime = savedResumeTime;
            video.pause();
          }
        }
      } else if (shouldUseTeaser) {
        if (hlsSrc) {
          fetch(hlsSrc, { mode: 'cors' }).catch(function () {});
        }
        video.src = smartAutoplaySrc;
        video.loop = true;
        video.muted = true;
        const playPromise = video.play();
        if (playPromise !== undefined) {
          playPromise.then(function () {
            registerPlay();
          }).catch(function () {});
        }
      } else if (primaryStream) {
        if (primaryStream.includes('.m3u8')) {
          loadHlsStream(primaryStream, 0, isPreview ? true : !smartAutoplay, false);
        } else {
          video.src = primaryStream;
          if (isPreview) {
            video.muted = false;
            const pp = video.play();
            if (pp !== undefined) {
              pp.catch(function () {
                video.muted = true;
                video.play().catch(function () {});
              });
            }
          } else {
            startPlayback();
          }
        }
      }

      smartOverlay.addEventListener('click', unmuteAndRestart);

      function unmuteAndRestart() {
        hasUserUnmuted = true;
        smartOverlay.classList.add('hidden');
        video.loop = false;

        const cur = video.currentTime || 0;
        const targetTime = cur > 2 ? 0 : cur;

        if (hlsSrc) {
          loadHlsStream(hlsSrc, targetTime, true);
        } else if (videoSrc && video.src !== videoSrc) {
          video.src = videoSrc;
          video.currentTime = targetTime;
          video.muted = false;
          video.volume = 1;
          video.play().catch(function () {});
        } else {
          video.muted = false;
          video.volume = 1;
          if (targetTime === 0) video.currentTime = 0;
          video.play().catch(function () {});
        }
      }

      let indicatorTimeout;
      playbackShield.addEventListener('click', function () {
        if (resumeModal && resumeModal.classList.contains('active')) {
          return;
        }
        if (!hasUserUnmuted && smartAutoplay && !smartOverlay.classList.contains('hidden')) {
          unmuteAndRestart();
          return;
        }
        if (video.paused) {
          video.play();
          showPlayPause(true);
        } else {
          video.pause();
          showPlayPause(false);
        }
      });

      function showPlayPause(isPlaying) {
        clearTimeout(indicatorTimeout);
        if (isPlaying) {
          playPauseIcon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"></polygon>';
        } else {
          playPauseIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';
        }
        playPauseIndicator.classList.add('show');
        indicatorTimeout = setTimeout(function () {
          playPauseIndicator.classList.remove('show');
        }, 500);
      }

      const pixelFired = { p25: false, p50: false, p75: false, p90: false, pitch: false };
      const milestonesFired = new Set();

      video.addEventListener('timeupdate', function () {
        const cur = video.currentTime;
        const dur = video.duration || 1;
        let percentage = (cur / dur) * 100;

        if (fakeProgress && percentage > 0 && percentage < 95) {
          const factor = Math.min(1.35, 1 + (1 - percentage / 100) * 0.35);
          percentage = Math.min(percentage * factor, 98);
        }

        progressBarFill.style.width = Math.min(100, Math.max(0, percentage)) + '%';

        const rawPct = (cur / dur) * 100;
        const targets = [10, 25, 50, 75, 90];
        for (const t of targets) {
          if (rawPct >= t && !milestonesFired.has(t)) {
            milestonesFired.add(t);
            emitAnalyticsEvent('progress', t, cur);
          }
        }

        if (resumeEnabled && cur > 5 && cur < dur - 5) {
          try {
            localStorage.setItem(storageKey, Math.floor(cur));
          } catch (e) {}
        }

        if (ctaEnabled && ctaTime > 0 && cur >= ctaTime) {
          if (!ctaContainer.classList.contains('visible')) {
            ctaContainer.classList.add('visible');
            emitAnalyticsEvent('pitch_viewed', null, cur);
            emitAnalyticsEvent('cta_shown', null, cur);
            if (pixelsEnabled && !pixelFired.pitch) {
              pixelFired.pitch = true;
              sendTrackingEvent('PitchViewed', { time: cur });
            }
            if (window.parent) {
              try {
                window.parent.postMessage({
                  type: 'vturb_pitch_revealed',
                  videoId: vidId,
                  cta: {
                    position: ctaPosition,
                    text: ctaText,
                    url: ctaUrl,
                    color: ctaColor,
                    subtext: ctaSub,
                    openInNewTab: ctaNewTab
                  }
                }, '*');
              } catch (e) {}
            }
          }
        }

        if (pixelsEnabled && dur > 1) {
          if (rawPct >= 25 && !pixelFired.p25) {
            pixelFired.p25 = true;
            sendTrackingEvent('VideoPercent25', { percent: 25 });
          }
          if (rawPct >= 50 && !pixelFired.p50) {
            pixelFired.p50 = true;
            sendTrackingEvent('VideoPercent50', { percent: 50 });
          }
          if (rawPct >= 75 && !pixelFired.p75) {
            pixelFired.p75 = true;
            sendTrackingEvent('VideoPercent75', { percent: 75 });
          }
          if (rawPct >= 90 && !pixelFired.p90) {
            pixelFired.p90 = true;
            sendTrackingEvent('VideoPercent90', { percent: 90 });
          }
        }
      });

      ctaBtn.addEventListener('click', function () {
        emitAnalyticsEvent('cta_clicked', null, video.currentTime || 0);
        sendTrackingEvent('CtaClicked', { time: video.currentTime || 0, url: ctaBtn.href });
      });

      function sendTrackingEvent(eventName, payload) {
        if (window.parent) {
          window.parent.postMessage({
            source: 'cloudvturb_player',
            event: eventName,
            data: payload
          }, '*');
        }

        try {
          if (typeof window.fbq === 'function') {
            window.fbq('trackCustom', eventName, payload);
          }
        } catch (e) {}
      }

      if (resumeEnabled && hasSavedResume) {
        video.addEventListener('loadedmetadata', function () {
          if (video.duration && savedResumeTime >= video.duration - 5) {
            try { localStorage.removeItem(storageKey); } catch (err) {}
            if (resumeModal) resumeModal.classList.remove('active');
            if (smartAutoplay && !hasUserUnmuted) {
              if (smartOverlay) smartOverlay.classList.remove('hidden');
              video.muted = true;
              video.currentTime = 0;
              video.play().catch(function () {});
            }
          }
        });
      }

      video.addEventListener('ended', function () {
        if (!milestonesFired.has(100)) {
          milestonesFired.add(100);
          emitAnalyticsEvent('progress', 100, video.duration || 0);
        }
        emitAnalyticsEvent('complete', 100, video.duration || 0);
        try {
          localStorage.removeItem(storageKey);
        } catch (e) {}
      });
    })();
</script>
</body>
</html>
